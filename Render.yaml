# =====================================================================
# PROJECT DEPLOYMENT BUNDLE (render.yaml, requirements.txt, main.py)
# =====================================================================

# --- [FILE 1: render.yaml] ---
services:
  - type: web
    name: fastmcp-render-app
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0


# --- [FILE 2: requirements.txt] ---
fastapi
uvicorn
fastmcp
pydantic


# --- [FILE 3: main.py] ---
from fastapi import FastAPI
from fastmcp import FastMCP
import uvicorn
import os

# Initialize FastAPI app
app = FastAPI()

# Initialize FastMCP server
mcp = FastMCP("My Render MCP Server")

@app.get("/")
def read_root():
    return {"status": "FastMCP server is live and running on Render!"}

@app.get("/health")
def health_check():
    return {"status": "healthy"}

# Example custom FastMCP tool
@mcp.tool()
def add_numbers(a: int, b: int) -> int:
    """Add two numbers together"""
    return a + b

if __name__ == "__main__":
    # Render assigns a dynamic port via environment variables
    port = int(os.environ.get("PORT", 10000))
    uvicorn.run(app, host="0.0.0.0", port=port)
